name: Update XBSLink-NG Version

on:
  repository_dispatch:
    types: [xbslink-ng-release]
  workflow_dispatch:
    inputs:
      version:
        description: 'XBSLink-NG version to update to (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  update-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "repository_dispatch" ]]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Updating xbslink-ng binary to: ${VERSION}"

      - name: Bump addon version (CalVer)
        id: addon_version
        run: |
          CURRENT=$(grep 'version:' xbslink-ng/config.yaml | head -1 | sed 's/.*"\(.*\)"/\1/')
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          PREFIX="${YEAR}.${MONTH}"

          # If current version starts with this month's prefix, increment patch
          if [[ "$CURRENT" == "${PREFIX}."* ]]; then
            PATCH=$(echo "$CURRENT" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
          else
            NEW_PATCH=0
          fi

          NEW_VERSION="${PREFIX}.${NEW_PATCH}"
          echo "current=${CURRENT}" >> $GITHUB_OUTPUT
          echo "new=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "Addon version: ${CURRENT} -> ${NEW_VERSION}"

      - name: Update Dockerfile
        run: |
          sed -i "s/ARG XBSLINK_VERSION=.*/ARG XBSLINK_VERSION=${{ steps.version.outputs.version }}/" xbslink-ng/Dockerfile
          echo "Updated Dockerfile with xbslink-ng ${{ steps.version.outputs.version }}"

      - name: Update config.yaml
        run: |
          sed -i "s/version: \".*\"/version: \"${{ steps.addon_version.outputs.new }}\"/" xbslink-ng/config.yaml
          echo "Updated config.yaml addon version to ${{ steps.addon_version.outputs.new }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xbslink-ng/Dockerfile xbslink-ng/config.yaml
          git commit -m "feat(xbslink-ng): update binary to ${{ steps.version.outputs.version }} (addon ${{ steps.addon_version.outputs.new }})"
          git push
