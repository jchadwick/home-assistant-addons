name: Auto Version Bump

on:
  push:
    branches:
      - main
    paths:
      - 'xbslink-ng/**'
      - '!xbslink-ng/config.yaml'  # Don't trigger on version bumps themselves

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep '^version:' xbslink-ng/config.yaml | sed 's/version: "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Calculate new version (CalVer YYYY.MM.MICRO)
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)

          # Extract current year, month, micro
          IFS='.' read -r CUR_YEAR CUR_MONTH CUR_MICRO <<< "$CURRENT"

          if [[ "$CUR_YEAR" == "$YEAR" ]] && [[ "$CUR_MONTH" == "$MONTH" ]]; then
            # Same month - increment micro
            NEW_MICRO=$((CUR_MICRO + 1))
          else
            # New month - reset micro to 0
            NEW_MICRO=0
          fi

          NEW_VERSION="${YEAR}.${MONTH}.${NEW_MICRO}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update config.yaml
        run: |
          sed -i 's/^version: ".*"/version: "${{ steps.new_version.outputs.version }}"/' xbslink-ng/config.yaml

      - name: Update CHANGELOG.md
        run: |
          DATE=$(date +%Y-%m-%d)
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Create new changelog entry
          cat > /tmp/new_entry.md <<EOF
## [$NEW_VERSION] - $DATE

### Changed
- Auto-deployed from main branch

EOF

          # Insert after the "Versioning follows CalVer" line
          sed -i "/^Versioning follows CalVer/r /tmp/new_entry.md" xbslink-ng/CHANGELOG.md

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xbslink-ng/config.yaml xbslink-ng/CHANGELOG.md
          git commit -m "chore(xbslink-ng): bump version to ${{ steps.new_version.outputs.version }} [skip ci]"
          git push
