name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  version-and-deploy:
    name: Version Bump & Deploy
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep '^version:' xbslink-ng/config.yaml | sed 's/version: "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Calculate new version (CalVer YYYY.MM.MICRO)
        id: new_version
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)

          IFS='.' read -r CUR_YEAR CUR_MONTH CUR_MICRO <<< "$CURRENT"

          if [[ "$CUR_YEAR" == "$YEAR" ]] && [[ "$CUR_MONTH" == "$MONTH" ]]; then
            NEW_MICRO=$((CUR_MICRO + 1))
          else
            NEW_MICRO=0
          fi

          NEW_VERSION="${YEAR}.${MONTH}.${NEW_MICRO}"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update config.yaml
        run: |
          sed -i 's/^version: ".*"/version: "${{ steps.new_version.outputs.version }}"/' xbslink-ng/config.yaml
          cat xbslink-ng/config.yaml | grep version

      - name: Update CHANGELOG.md
        run: |
          DATE=$(date +%Y-%m-%d)
          NEW_VERSION="${{ steps.new_version.outputs.version }}"

          # Create temp file with new entry
          echo "" > /tmp/new_entry.md
          echo "## [$NEW_VERSION] - $DATE" >> /tmp/new_entry.md
          echo "" >> /tmp/new_entry.md
          echo "### Changed" >> /tmp/new_entry.md
          echo "- Auto-deployed from main branch" >> /tmp/new_entry.md
          echo "" >> /tmp/new_entry.md

          # Insert after the CalVer line
          awk '/^Versioning follows CalVer/ { print; system("cat /tmp/new_entry.md"); next }1' xbslink-ng/CHANGELOG.md > /tmp/changelog_new.md
          mv /tmp/changelog_new.md xbslink-ng/CHANGELOG.md

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xbslink-ng/config.yaml xbslink-ng/CHANGELOG.md
          git commit -m "chore(xbslink-ng): bump version to ${{ steps.new_version.outputs.version }}"
          git push

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all architectures
        uses: home-assistant/builder@2025.11.0
        with:
          args: |
            --amd64 \
            --aarch64 \
            --target /data/xbslink-ng \
            --docker-hub "ghcr.io/${{ github.repository_owner }}"
        env:
          DOCKER_USERNAME: ${{ github.repository_owner }}
          DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
