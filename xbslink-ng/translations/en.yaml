configuration:
  mode:
    name: Mode
    description: Choose 'listen' if you are acting as the host, or 'connect' to join a host

  interface:
    name: Network Interface
    description: The network interface of the network where your Xbox is connected (e.g., eth0, wlan0). Use 'ha network info' to list interfaces.

  xbox_mac:
    name: Xbox MAC Address
    description: Your Xbox MAC address. Leave this empty to auto-detect on startup, or specify it if auto-detection fails.

  key:
    name: Pre-Shared Key
    description: A secret key that both peers must use. HIGHLY RECOMMENDED for security - without it anyone can inject packets into your network!

  log_level:
    name: Log Level
    description: Logging verbosity. Use 'debug' or 'trace' for troubleshooting.

  stats_interval:
    name: Statistics Interval
    description: How often (in seconds) to print traffic statistics to the log. Set to 0 to disable.

  port:
    name: UDP Port (Listen Mode)
    description: Port to listen on when in 'listen' mode. Forward this port through your router to Home Assistant.

  peer_address:
    name: Host Address (Connect Mode)
    description: The host's public IP or DNS name and port in IP:PORT format (e.g., 203.0.113.50:31415) when in 'connect' mode.
